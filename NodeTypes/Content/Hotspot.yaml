'FormatD.HotspotEditor:Content.Hotspot':
  label: "${q(node).property('hoverTitle') ? q(node).property('hoverTitle') : q(node).property('xPosition') + 'x ' + q(node).property('yPosition') + 'y'}"
  superTypes:
    'Neos.Neos:Content': true
  ui:
    group: general
    label: i18n
    icon: icon-bullseye
    inspector:
      groups:
        document:
          label: i18n
  properties:
    xPosition:
      type: float
      defaultValue: 2.0
      ui:
        label: i18n
        reloadIfChanged: false
        inspector:
          group: document
          editor: FormatD.HotspotEditor/HotspotEditor
          editorOptions:
            min: 0
            max: 100
            step: 0.1
            unit: '%'
      validation:
        'Neos.Neos/Validation/NumberRangeValidator':
          minimum: 0
          maximum: 100
    yPosition:
      type: float
      defaultValue: 2.0
      ui:
        label: i18n
        reloadIfChanged: false
        inspector:
          group: document
          editor: FormatD.HotspotEditor/HotspotEditor
          editorOptions:
            min: 0
            max: 100
            step: 0.1
            unit: '%'
      validation:
        'Neos.Neos/Validation/NumberRangeValidator':
          minimum: 0
          maximum: 100
    link:
      type: reference
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: document
          editorOptions:
            nodeTypes:
              - 'Neos.Neos:Document'
    hoverTitle:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: document
          position: 50
